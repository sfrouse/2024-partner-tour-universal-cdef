<html>
  <head>
    <title>InsideBox Sign Up</title>
  </head>
  <body style="margin: 0; display: flex; flex-direction: column; height: 100vh;">
    <div style="flex: 1; display: flex;">
      <div style="flex: 1; background-image: url('https://placehold.co/600x400'); background-size: cover;"></div>
      <div style="width: 400px; background-color: white; padding: 40px; display: flex; flex-direction: column; justify-content: center;">
        <img src="https://placehold.co/200x50" style="width: 200px; margin-bottom: 20px;">
        <h2 style="margin-top: 0;">Start your journey</h2>
        <h1 style="margin-bottom: 40px;">Sign Up to InsideBox</h1>
        <form style="display: flex; flex-direction: column;">
          <input type="email" placeholder="example@email.com" style="padding: 10px; margin-bottom: 10px;">
          <input type="password" placeholder="••••••••" style="padding: 10px; margin-bottom: 20px;">
          <button type="submit" style="padding: 10px; background-color: #2196F3; color: white; border: none; cursor: pointer;">Sign Up</button>
        </form>
        <p>or sign up with</p>
        <div style="display: flex; justify-content: space-between;">
          <img src="https://placehold.co/30x30">
          <img src="https://placehold.co/30x30">
          <img src="https://placehold.co/30x30">
        </div>
        <p>Have an account? <a href="#">Sign in</a></p>
      </div>
    </div>
  </body>
</html>
